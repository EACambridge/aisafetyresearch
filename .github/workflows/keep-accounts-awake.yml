name: Keep accounts database awake

# Supabase pauses free projects after a week without activity, which would
# stop sign-ups working. This makes a small database request every three days.
# If it fails, GitHub emails the repository owner, so a pause doesn't go unnoticed.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ask the database for published write-ups
        run: |
          URL=$(sed -n 's/.*SUPABASE_URL = "\([^"]*\)".*/\1/p' supabase-config.js)
          KEY=$(sed -n 's/.*SUPABASE_ANON_KEY = "\([^"]*\)".*/\1/p' supabase-config.js)
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 -X POST "$URL/rest/v1/rpc/published_posts" \
                 -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' > /dev/null; then
              echo "Database is awake."
              exit 0
            fi
            echo "Attempt $attempt failed, trying again in 60 seconds."
            sleep 60
          done
          echo "::error::The accounts database didn't respond. It may be paused: open the Supabase dashboard and resume the project."
          exit 1
